version: 2

seeds:
  - name: regions
    description: >
      Balancing authorities covered by gridlens. The same file ships inside the Python
      package (src/gridlens/common/regions.csv) and a unit test keeps them identical.
    config:
      column_types:
        latitude: float
        longitude: float
    columns:
      - name: region_code
        data_tests: [unique, not_null]
      - name: iso_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["ISO", "RTO", "Utility"]
      - name: timezone
        data_tests: [not_null]

  - name: fuel_types
    description: EIA energy-source codes used by the hourly fuel-type-data route.
    config:
      column_types:
        is_renewable: boolean
        is_dispatchable: boolean
    columns:
      - name: fuel_type_code
        data_tests: [unique, not_null]
      - name: fuel_category
        data_tests:
          - accepted_values:
              arguments:
                values: ["Fossil", "Nuclear", "Renewable", "Storage", "Other"]

  - name: us_holidays
    description: US federal holidays (generated by scripts/generate_holiday_seed.py).
    config:
      column_types:
        holiday_date: date
    columns:
      - name: holiday_date
        data_tests: [unique, not_null]
