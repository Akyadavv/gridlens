version: 2

models:
  - name: stg_open_meteo__weather_archive
    description: Observed (reanalysis) hourly weather per region, UTC.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [region_code, period_utc]
    columns:
      - name: region_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('regions')
                field: region_code
      - name: temperature_c
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -60
                max_value: 60
      - name: relative_humidity_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: stg_open_meteo__weather_forecast
    description: Latest-issued forecast per region and UTC hour.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [region_code, period_utc]
    columns:
      - name: issue_date
        data_tests: [not_null]
