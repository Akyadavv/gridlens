version: 2

models:
  - name: stg_ml__demand_forecast
    description: Latest forecast per model, region, hour and live/backtest flag.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [model_name, region_code, period_utc, is_backtest]
    columns:
      - name: model_name
        data_tests:
          - accepted_values:
              arguments:
                values: ["lightgbm", "sarima", "seasonal_naive"]
      - name: forecast_mwh
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: stg_ml__forecast_metrics
    description: Backtest MAPE / RMSE written by each forecast run.
    columns:
      - name: mape
        data_tests: [not_null]
