version: 2

sources:
  - name: ml
    description: >
      Written by the Python forecast job (gridlens-forecast) after the core dbt build.
      DDL lives in snowflake/02_analytics_objects.sql and gridlens/forecast/io.py.
    database: ANALYTICS
    schema: ML
    config:
      tags: ["forecast_output"]
      loaded_at_field: issued_at
      freshness:
        warn_after: {count: 30, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: demand_forecast
        description: Hourly demand forecasts per model, region and target hour (live + backtest).
      - name: forecast_metrics
        description: Backtest accuracy per model and region for each run.
